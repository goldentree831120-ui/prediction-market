# CI: contract tests, mutation checks, the Rust data fetcher and the calibration + news analysis on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Market + pool tests and mutation check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build --sizes
      - name: forge test (46 unit/fuzz tests incl. pool vectors shared with the dashboard + 9 invariants)
        run: forge test
      - name: Mutation check (15 planted bugs must all be caught)
        run: ./script/mutation-check.sh | tee /tmp/mutation.txt && ! grep -qE "SURVIVED|\?\?" /tmp/mutation.txt

  pipeline:
    name: Rust data fetcher (fmt, clippy, tests; never calls the live API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test (recorded fixtures + a local test server)
        run: cargo test --locked

  analysis:
    name: Analysis + dashboard (tests + mutation check; synthetic data only, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Mutation check (22 planted analysis mistakes must all be caught)
        run: python mutation_check.py
