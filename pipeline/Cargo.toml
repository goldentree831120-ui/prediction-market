[package]
name = "pm-fetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Read-only fetcher for public Manifold Markets data (P4 M3). No keys, no trading, rate-limited."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
